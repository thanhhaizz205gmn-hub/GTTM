version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital_twin_app
    ports:
      - "8000:8000"
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Ho_Chi_Minh

  mock_sensor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital_twin_mock_sensor
    command: ["python", "mock_iot_sensor.py"]
    depends_on:
      - app
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Ho_Chi_Minh

  nginx:
    image: nginx:alpine
    container_name: digital_twin_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Build_Web:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: digital_twin_cloudflared
    command: tunnel --no-autoupdate run --token eyJhIjoiYjgyNDYzN2IzNGU2MzFiNjc2YzI0ZjgxMjQ0MTc2ZjQiLCJ0IjoiYjA3MGM0N2QtOGM2Yi00YTNiLTlkOTktMDQyYzZmY2U4OGEyIiwicyI6IlpHTXdNbVJtT1RFdFpqWTNNQzAwTUdObUxUZzRZemN0T0dRNVpqbGtObUppWldSaCJ9
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
      - nginx
    restart: always
