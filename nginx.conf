server {
    listen 80;
    server_name gamification.ink www.gamification.ink localhost;

    root /usr/share/nginx/html;
    index index.html;

    set $cors_origin *;

    # Cấu hình chuẩn cho Unity WebGL (Nén Gzip .wasm.gz, .data.gz, .js.gz)
    location ~* \.data\.gz$ {
        default_type application/octet-stream;
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    location ~* \.wasm\.gz$ {
        default_type application/wasm;
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    location ~* \.js\.gz$ {
        default_type application/javascript;
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    location ~* \.symbols\.json\.gz$ {
        default_type application/octet-stream;
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Reverse proxy các API suy luận AI & Dashboard về container app (FastAPI)
    location /predict {
        proxy_pass http://app:8000/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /energy/ {
        proxy_pass http://app:8000/energy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dashboard {
        proxy_pass http://app:8000/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /unity_build/ {
        proxy_pass http://app:8000/unity_build/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển hướng mặc định về Dashboard
    location / {
        proxy_pass http://app:8000/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
