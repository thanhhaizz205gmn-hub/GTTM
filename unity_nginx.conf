server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # CORS dùng chung cho mọi response reverse-proxy
    set $cors_origin *;

    # Cấu hình chuẩn cho Unity WebGL (Luôn cập nhật bản build mới nhất khi F5)
    location ~* \.data\.gz$ {
        default_type application/octet-stream;
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    location ~* \.wasm\.gz$ {
        default_type application/wasm;
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    location ~* \.js\.gz$ {
        default_type application/javascript;
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    location ~* \.symbols\.json\.gz$ {
        default_type application/octet-stream;
        gzip off;
        add_header Content-Encoding gzip always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Reverse proxy toàn bộ API FastAPI (predict, forecast, ventilation, lighting, energy, dashboard)
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://host.docker.internal:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
